name: Sterling Payroll — Quality Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All JavaScript syntax and deployment assets
        run: |
          for file in src/*.js tests/*.test.mjs; do
            node --check "$file" || exit 1
          done
          for file in index.html styles.css ui-system.css phase2.html phase3-time.html phase3-payroll.html phase4.html phase5.html phase6.html commissions.html firestore.rules; do
            test -s "$file" || exit 1
          done
      - name: Payroll engine tests
        run: node --test tests/*.test.mjs

  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator testing dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate Firestore rules against real emulator
        run: npm run test:rules
