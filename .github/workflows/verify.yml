name: Sterling Payroll — Quality Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/app.js
          node --check src/payroll-core.js
          node --check src/phase2.js
          node --check src/phase2-core.js
          node --check src/staff.js
          node --check src/phase3.js
          node --check src/phase3-core.js
          node --check src/phase4.js
          node --check src/phase4-core.js
          node --check src/owner.js
          node --check src/owner-core.js
          node --check src/phase5.js
          node --check src/phase5-core.js
          node --check src/phase6.js
          node --check src/phase6-core.js
      - name: Payroll engine tests
        run: node --test tests/*.test.mjs

  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator testing dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate Firestore rules against real emulator
        run: npm run test:rules
