name: Publish Sterling Payroll
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sterling-payroll-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site/src
          cp index.html styles.css favicon.svg phase2.html phase3-time.html phase3-payroll.html phase4.html phase5.html phase6.html commissions.html _site/
          # Copy every source module so additions cannot silently break Pages.
          cp src/*.js _site/src/
          touch _site/.nojekyll
          for file in _site/src/*.js _site/*.html; do
            test -s "$file" || { echo "Missing deploy asset: $file"; exit 1; }
          done
          # Check all shipped JavaScript modules, not just older entry points.
          for file in _site/src/*.js; do
            node --input-type=module --check < "$file" || exit 1
          done
          # Validate local static imports, including newly added feature modules.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const name of fs.readdirSync('_site/src').filter(name => name.endsWith('.js'))) {
            const full = path.join('_site/src', name);
            const content = fs.readFileSync(full, 'utf8');
            for (const match of content.matchAll(/(?:import|export)\s+(?:[^;]*?\s+from\s+)?["'](\.\/[^"']+)["']/g)) {
              const local = path.join('_site/src', match[1].split('?')[0]);
              if (!fs.existsSync(local)) throw Error(full + ' requires missing module ' + match[1]);
            }
          }
          NODE
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
