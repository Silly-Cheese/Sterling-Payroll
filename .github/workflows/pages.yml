name: Publish Sterling Payroll
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sterling-payroll-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site/src
          cp index.html styles.css favicon.svg phase2.html phase3-time.html phase3-payroll.html phase4.html _site/
          cp src/app.js src/payroll-core.js src/phase2.js src/phase2-core.js src/staff.js src/phase3.js src/phase3-core.js src/phase4.js src/phase4-core.js src/owner.js src/owner-core.js src/phase5.js src/phase5-core.js _site/src/
          touch _site/.nojekyll
          for file in _site/src/phase4.js _site/src/phase4-core.js _site/src/owner.js _site/src/owner-core.js _site/src/phase5.js _site/src/phase5-core.js; do
            test -s "$file" || { echo "Missing deploy asset: $file"; exit 1; }
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
