name: Publish Sterling Payroll
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sterling-payroll-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p _site/src
          cp index.html styles.css favicon.svg phase2.html phase3-time.html phase3-payroll.html phase4.html phase5.html phase6.html commissions.html _site/
          cp src/app.js src/payroll-core.js src/phase2.js src/phase2-core.js src/staff.js src/phase3.js src/phase3-core.js src/phase4.js src/phase4-core.js src/owner.js src/owner-core.js src/phase5.js src/phase5-core.js src/phase6.js src/phase6-core.js src/record-actions.js src/modals.js src/deletion-engine.js src/workspace-ui.js src/commissions.js src/commission-core.js src/commission-payroll.js _site/src/
          touch _site/.nojekyll
          for file in _site/src/*.js _site/*.html; do
            test -s "$file" || { echo "Missing deploy asset: $file"; exit 1; }
          done
          node --check _site/src/app.js
          node --check _site/src/phase5.js
          node --check _site/src/phase6.js
          node --check _site/src/commissions.js
          node --check _site/src/commission-payroll.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
