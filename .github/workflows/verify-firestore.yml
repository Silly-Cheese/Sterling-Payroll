name: Verify Firestore rules and payroll writes
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - package.json
      - src/payroll-*.js
      - src/commission-*.js
      - tests/**
      - .github/workflows/verify-firestore.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - package.json
      - src/payroll-*.js
      - src/commission-*.js
      - tests/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-and-business-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test and emulator tools
        run: npm install --no-audit --no-fund
      - name: Check JavaScript business rules
        run: npm test
      - name: Verify Firestore authorization using a local emulator
        run: npm run test:rules
